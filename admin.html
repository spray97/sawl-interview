<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>관리자 — 수원외고 면접후기</title>
  <style>
    :root {
      --primary:   #1a3a6b;
      --primary-d: #122b52;
      --accent:    #c8a951;
      --bg:        #f0f4fb;
      --card-bg:   #ffffff;
      --text:      #1e2535;
      --text-s:    #5a6378;
      --border:    #dde3f0;
      --radius:    12px;
      --shadow:    0 2px 12px rgba(26,58,107,.10);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Pretendard', 'Noto Sans KR', sans-serif;
      background: var(--bg); color: var(--text);
      min-height: 100vh; display: flex; flex-direction: column;
    }
    header {
      background: var(--primary); color: #fff;
      padding: 0 20px; height: 56px;
      display: flex; align-items: center;
    }
    header h1 { font-size: 1rem; font-weight: 700; }
    header h1 span { color: var(--accent); }

    main {
      flex: 1; display: flex; align-items: center;
      justify-content: center; padding: 32px 16px;
    }
    .card {
      background: var(--card-bg); border-radius: var(--radius);
      box-shadow: var(--shadow); padding: 40px 36px;
      width: 100%; max-width: 480px;
    }
    .card-icon { font-size: 2.5rem; text-align: center; margin-bottom: 12px; }
    .card h2 {
      font-size: 1.25rem; color: var(--primary);
      text-align: center; margin-bottom: 6px;
    }
    .card p.desc {
      font-size: .85rem; color: var(--text-s);
      text-align: center; margin-bottom: 28px;
    }

    label {
      display: block; font-size: .85rem; font-weight: 600;
      color: var(--text-s); margin-bottom: 6px;
    }
    input[type="password"], input[type="text"] {
      width: 100%; padding: 12px 14px;
      border: 2px solid var(--border); border-radius: 8px;
      font-size: 1rem; outline: none; transition: border-color .2s;
      margin-bottom: 18px;
    }
    input:focus { border-color: var(--primary); }
    input.error { border-color: #e05252; }

    .btn-primary {
      width: 100%; padding: 14px;
      background: var(--primary); color: #fff;
      border: none; border-radius: 8px;
      font-size: 1rem; font-weight: 700;
      cursor: pointer; transition: background .2s;
    }
    .btn-primary:hover:not(:disabled) { background: var(--primary-d); }
    .btn-primary:disabled { opacity: .6; cursor: not-allowed; }

    .pat-row {
      display: flex; gap: 8px; align-items: flex-start;
      margin-bottom: 18px;
    }
    .pat-row input { margin-bottom: 0; flex: 1; }
    .pat-row button {
      padding: 12px 14px; white-space: nowrap;
      background: var(--bg); border: 2px solid var(--border);
      border-radius: 8px; font-size: .82rem; cursor: pointer;
      color: var(--text-s); transition: border-color .2s;
      flex-shrink: 0;
    }
    .pat-row button:hover { border-color: var(--primary); color: var(--primary); }

    #status {
      margin-top: 20px; font-size: .875rem;
      border-radius: 8px; padding: 12px 16px;
      display: none;
    }
    #status.info    { background: #e8f0fe; color: #1a3a6b; display: block; }
    #status.success { background: #e6f4ea; color: #1b5e20; display: block; }
    #status.error   { background: #fce8e6; color: #b71c1c; display: block; }

    .progress-list {
      margin-top: 8px; padding-left: 1.2em;
      font-size: .82rem; line-height: 1.8;
    }

    .pat-saved-badge {
      font-size: .78rem; color: #2e7d32;
      margin-top: -12px; margin-bottom: 18px;
    }

    #screen-change { display: none; }
  </style>
</head>
<body>
<header>
  <h1>수원외고 면접후기 <span>관리자</span></h1>
</header>
<main>
  <!-- 1단계: 현재 인증코드 확인 -->
  <div class="card" id="screen-auth">
    <div class="card-icon">🔐</div>
    <h2>관리자 인증</h2>
    <p class="desc">현재 인증코드를 입력하여 관리자 페이지에 접근합니다.</p>

    <label for="old-pw">현재 인증코드</label>
    <input type="password" id="old-pw" placeholder="현재 인증코드 입력"
           autocomplete="off" onkeydown="if(event.key==='Enter') verifyAdmin()">

    <button class="btn-primary" id="btn-verify" onclick="verifyAdmin()">확인</button>
    <div id="status"></div>
  </div>

  <!-- 2단계: 새 인증코드 + PAT 입력 -->
  <div class="card" id="screen-change">
    <div class="card-icon">✏️</div>
    <h2>인증코드 변경</h2>
    <p class="desc">새 인증코드와 GitHub PAT를 입력하세요.</p>

    <label for="new-pw">새 인증코드</label>
    <input type="password" id="new-pw" placeholder="새 인증코드" autocomplete="off">

    <label for="confirm-pw">새 인증코드 확인</label>
    <input type="password" id="confirm-pw" placeholder="새 인증코드 재입력" autocomplete="off">

    <label for="pat">GitHub Personal Access Token</label>
    <div class="pat-row">
      <input type="text" id="pat" placeholder="ghp_xxxxxxxxxxxx" autocomplete="off" spellcheck="false">
      <button onclick="clearPat()">삭제</button>
    </div>
    <div id="pat-saved-msg" class="pat-saved-badge" style="display:none">✓ 저장된 PAT 불러옴</div>

    <button class="btn-primary" id="btn-change" onclick="changePassword()">비밀번호 변경</button>
    <div id="status2"></div>
  </div>
</main>

<script>
const REPO  = 'spray97/sawl-interview';
const FILES = ['interviews.json', 'school-analysis.json'];
const _SALT = new Uint8Array([83,65,87,76,45,73,78,84,69,82,86,73,69,87,50,54]);

let _oldKey   = null;
let _fetched  = null;

window.addEventListener('load', () => {
  const pat = localStorage.getItem('sawl_admin_pat');
  if (pat) {
    document.getElementById('pat').value = pat;
    document.getElementById('pat-saved-msg').style.display = 'block';
  }
});

function clearPat() {
  localStorage.removeItem('sawl_admin_pat');
  document.getElementById('pat').value = '';
  document.getElementById('pat-saved-msg').style.display = 'none';
}

async function deriveKey(password, usages) {
  const km = await crypto.subtle.importKey(
    'raw', new TextEncoder().encode(password), 'PBKDF2', false, ['deriveKey']
  );
  return crypto.subtle.deriveKey(
    { name: 'PBKDF2', salt: _SALT, iterations: 100000, hash: 'SHA-256' },
    km, { name: 'AES-GCM', length: 256 }, false, usages
  );
}

async function decrypt(encStr, key) {
  const { iv, ciphertext } = JSON.parse(encStr);
  const ivBuf = Uint8Array.from(atob(iv), c => c.charCodeAt(0));
  const ctBuf = Uint8Array.from(atob(ciphertext), c => c.charCodeAt(0));
  const plain = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: ivBuf }, key, ctBuf);
  return new TextDecoder().decode(plain);
}

async function encrypt(plaintext, key) {
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const encoded = new TextEncoder().encode(plaintext);
  const ciphertext = await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, key, encoded);
  return JSON.stringify({
    iv: uint8ToBase64(iv),
    ciphertext: uint8ToBase64(new Uint8Array(ciphertext))
  });
}

function uint8ToBase64(bytes) {
  let binary = '';
  const CHUNK = 8192;
  for (let i = 0; i < bytes.length; i += CHUNK) {
    binary += String.fromCharCode(...bytes.subarray(i, i + CHUNK));
  }
  return btoa(binary);
}

function strToBase64(str) {
  const bytes = new TextEncoder().encode(str);
  return uint8ToBase64(bytes);
}

async function getFileSHA(filename, token) {
  const res = await fetch(
    `https://api.github.com/repos/${REPO}/contents/${filename}`,
    { headers: { Authorization: `token ${token}`, Accept: 'application/vnd.github.v3+json' } }
  );
  if (!res.ok) throw new Error(`SHA 조회 실패: ${filename} (${res.status})`);
  return (await res.json()).sha;
}

async function updateFile(filename, content, sha, token) {
  const res = await fetch(
    `https://api.github.com/repos/${REPO}/contents/${filename}`,
    {
      method: 'PUT',
      headers: {
        Authorization: `token ${token}`,
        'Content-Type': 'application/json',
        Accept: 'application/vnd.github.v3+json'
      },
      body: JSON.stringify({
        message: `비밀번호 변경 (${new Date().toLocaleDateString('ko-KR')})`,
        content: strToBase64(content),
        sha
      })
    }
  );
  if (!res.ok) {
    const err = await res.json().catch(() => ({}));
    throw new Error(`업로드 실패: ${filename} — ${err.message || res.status}`);
  }
}

function setStatus(id, type, html) {
  const el = document.getElementById(id);
  el.className = type;
  el.innerHTML = html;
}

// ── 1단계: 현재 인증코드 검증 ──
async function verifyAdmin() {
  const oldPw = document.getElementById('old-pw').value.trim();
  if (!oldPw) { setStatus('status', 'error', '인증코드를 입력해주세요.'); return; }

  const btn = document.getElementById('btn-verify');
  btn.textContent = '확인 중...'; btn.disabled = true;
  setStatus('status', 'info', '🔑 인증코드 확인 중...');

  try {
    const key = await deriveKey(oldPw, ['decrypt']);

    const fetched = await Promise.all(
      FILES.map(f =>
        fetch(`https://raw.githubusercontent.com/${REPO}/main/${f}?t=${Date.now()}`)
          .then(r => { if (!r.ok) throw new Error(); return r.text(); })
      )
    );

    await Promise.all(fetched.map(enc => decrypt(enc, key)));

    _oldKey  = key;
    _fetched = fetched;

    document.getElementById('screen-auth').style.display   = 'none';
    document.getElementById('screen-change').style.display = 'block';
  } catch {
    setStatus('status', 'error', '❌ 인증코드가 올바르지 않습니다.');
  } finally {
    btn.textContent = '확인'; btn.disabled = false;
  }
}

// ── 2단계: 비밀번호 변경 ──
async function changePassword() {
  const newPw     = document.getElementById('new-pw').value.trim();
  const confirmPw = document.getElementById('confirm-pw').value.trim();
  const pat       = document.getElementById('pat').value.trim();

  if (!newPw || !confirmPw || !pat) {
    setStatus('status2', 'error', '모든 필드를 입력해주세요.'); return;
  }
  if (newPw !== confirmPw) {
    setStatus('status2', 'error', '새 인증코드가 일치하지 않습니다.'); return;
  }

  const btn = document.getElementById('btn-change');
  btn.textContent = '처리 중...'; btn.disabled = true;

  const steps = [];
  const addStep = (msg) => {
    steps.push(msg);
    setStatus('status2', 'info', `<ul class="progress-list">${steps.map(s=>`<li>${s}</li>`).join('')}</ul>`);
  };

  try {
    addStep('🔒 새 비밀번호로 재암호화 중...');
    const newKey = await deriveKey(newPw, ['encrypt']);
    const reencrypted = await Promise.all(_fetched.map(enc =>
      decrypt(enc, _oldKey).then(plain => encrypt(plain, newKey))
    ));

    addStep('📋 GitHub 파일 SHA 조회 중...');
    const shas = await Promise.all(FILES.map(f => getFileSHA(f, pat)));

    addStep('🚀 GitHub에 업로드 중...');
    await Promise.all(FILES.map((f, i) => updateFile(f, reencrypted[i], shas[i], pat)));

    localStorage.setItem('sawl_admin_pat', pat);

    setStatus('status2', 'success',
      `✅ 비밀번호 변경 완료!<br>
       <small style="display:block;margin-top:8px">
         GitHub Pages 반영까지 1~2분 소요될 수 있습니다.
       </small>
       <a href="index.html" style="display:inline-block;margin-top:14px;color:#1a3a6b;font-weight:700;text-decoration:underline;">
         ← 메인 페이지로 돌아가기
       </a>`
    );
  } catch (e) {
    setStatus('status2', 'error', `❌ ${e.message}`);
  } finally {
    btn.textContent = '비밀번호 변경'; btn.disabled = false;
  }
}
</script>
</body>
</html>
